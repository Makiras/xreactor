[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xreactor"
version = "0.1.0.dev0"
description = "Asyncio-native simulation triggers backed by xcomm"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MulanPSL-2.0"}
authors = [{name = "XS-MLVP"}]
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
]
docs = [
    "mkdocs>=1.6",
]

[project.scripts]
xreactor-coverage-report = "xreactor.coverage_report:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xreactor = ["templates/*.html", "templates/*.css"]

[tool.pyright]
pythonVersion = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests", "examples/getting_started", "examples/transactions/test_pipeline_coverage.py"]
